name: iOS - pruebas y evidencias

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pruebas-y-evidencias:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Pruebas unitarias de TodoCore (XCTest)
        shell: bash
        working-directory: Core
        run: |
          mkdir -p ../evidencias
          swift test 2>&1 | tee ../evidencias/resultado-pruebas-unitarias.txt

      - name: Compilar la app y tomar capturas en el simulador
        shell: bash
        run: bash ci/simulator_evidence.sh

      - name: Guardar evidencias en el repositorio
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f evidencias/build-log.txt
          git add -f evidencias
          git commit -m "Evidencias del simulador (run ${{ github.run_number }}) [skip ci]" || echo "Sin cambios"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Subir evidencias como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-SwiftTodoApp
          path: evidencias/
