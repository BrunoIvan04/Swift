name: iOS - pruebas y evidencias

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'Restaurant/**'
      - '.github/workflows/restaurant.yml'
  workflow_dispatch:

jobs:
  pruebas-y-evidencias:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      # Opcional: el GoogleService-Info.plist real como secreto del repositorio.
      # Si existe, se comprueba que la app compila con el proyecto real de Firebase.
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Pruebas unitarias de TodoCore (XCTest)
        shell: bash
        working-directory: Core
        run: |
          set -o pipefail
          mkdir -p ../evidencias
          swift test 2>&1 | tee ../evidencias/resultado-pruebas-unitarias.txt

      - name: Java para el emulador de Firestore
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Caché de paquetes Swift (Firebase)
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('SwiftTodoApp.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Iniciar el emulador de Firebase (Auth + Firestore)
        shell: bash
        run: |
          npm install -g firebase-tools@13 --no-audit --no-fund
          nohup firebase emulators:start --only auth,firestore --project demo-mis-tareas > emulador-firebase.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:8080 && curl -s -o /dev/null http://127.0.0.1:9099; then
              echo "Emulador listo"; exit 0
            fi
            sleep 2
          done
          cat emulador-firebase.log; exit 1

      - name: Pruebas de las reglas de seguridad de Firestore
        shell: bash
        working-directory: ci/rules-tests
        run: |
          set -o pipefail
          npm install --no-audit --no-fund
          npm test 2>&1 | tee ../../evidencias/resultado-pruebas-reglas.txt

      - name: Compilar con el proyecto real de Firebase (si hay secreto)
        if: env.GOOGLE_SERVICE_INFO_PLIST != ''
        shell: bash
        run: |
          set -o pipefail
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > SwiftTodoApp/GoogleService-Info.plist
          xcodebuild -project SwiftTodoApp.xcodeproj -scheme SwiftTodoApp \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-real -clonedSourcePackagesDirPath build/SourcePackages \
            build | tail -n 5

      - name: Compilar la app y tomar capturas en el simulador
        shell: bash
        run: |
          bash ci/write_demo_firebase_config.sh
          bash ci/simulator_evidence.sh

      - name: Guardar evidencias en el repositorio
        if: always()
        shell: bash
        run: |
          cp emulador-firebase.log evidencias/emulador-firebase-log.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f evidencias/build-log.txt
          git add -f evidencias
          git commit -m "Evidencias del simulador (run ${{ github.run_number }}) [skip ci]" || echo "Sin cambios"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Subir evidencias como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-SwiftTodoApp
          path: |
            evidencias/
            build/UITests.xcresult
